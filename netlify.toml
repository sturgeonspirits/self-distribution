# App version: 2026.09.23.15-WEB
[build]
  publish = "."
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)PROJECT_STATUS.md' ':(exclude)README.md' ':(exclude)docs/' ':(exclude)apps-script/' ':(exclude)tests/'"

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/customer"
  to = "/.netlify/functions/customer"
  status = 200

[[redirects]]
  from = "/go"
  to = "/.netlify/functions/go"
  status = 200
