# App version: 2026.10.08.38-WEB
[build]
  publish = "."
  functions = "netlify/functions"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)PROJECT_STATUS.md' ':(exclude)README.md' ':(exclude)docs/' ':(exclude)apps-script/' ':(exclude)tests/'"

[[redirects]]
  from = "/docs/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/claude/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/review-packages/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/imports/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/apps-script/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/PROJECT_STATUS.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "https://distribution-hub.netlify.app/*"
  to = "https://distribution.sturgeonspirits.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/inventory"
  to = "/.netlify/functions/inventory"
  status = 200

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/customer"
  to = "/.netlify/functions/customer"
  status = 200

[[redirects]]
  from = "/api/sell-sheet"
  to = "/.netlify/functions/sell-sheet"
  status = 200

[[redirects]]
  from = "/go"
  to = "/.netlify/functions/go"
  status = 200

[[headers]]
  for = "/sell-sheet.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
