<!doctype html>
<!-- App version: 2026.10.05.21-WEB -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="app-version" content="2026.10.05.21-WEB" />
  <title>Wholesale sell sheet | Sturgeon Spirits</title>
  <style>
    :root { --rust:#96321F; --brown:#7E613F; --ink:#242622; --cream:#F1F1E7; --tan:#C8BCA4; --olive:#58734f; --paper:#fffdf7; }
    * { box-sizing:border-box; } html { background:var(--cream); } body { margin:0; color:var(--ink); background:var(--cream); font:16px/1.5 Georgia, "Times New Roman", serif; }
    .bar { min-height:52px; padding:10px clamp(18px,4vw,54px); display:flex; justify-content:space-between; gap:12px; align-items:center; color:var(--cream); background:var(--ink); font:600 12px/1.2 Arial,sans-serif; letter-spacing:.09em; text-transform:uppercase; }
    .bar a { color:inherit; } .bar button, .button { appearance:none; border:1px solid var(--cream); color:var(--cream); padding:8px 12px; background:transparent; font:700 12px Arial,sans-serif; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; }
    .bar button:hover { color:var(--ink); background:var(--cream); } .page { width:min(1120px,100%); margin:auto; padding:0 18px 46px; }
    .hero { position:relative; isolation:isolate; overflow:hidden; min-height:360px; padding:clamp(36px,8vw,96px) clamp(24px,7vw,88px) 46px; color:var(--cream); background:var(--ink); }
    .hero::before { content:""; position:absolute; inset:0; z-index:-1; opacity:.84; background:linear-gradient(135deg,transparent 0 38%,rgba(135,166,127,.42) 38.2% 39%,transparent 39.2%),linear-gradient(36deg,transparent 0 55%,rgba(150,50,31,.65) 55.2% 56%,transparent 56.2%),radial-gradient(circle at 82% 19%,var(--rust),transparent 21%),radial-gradient(circle at 13% 105%,var(--olive),transparent 43%); }
    .hero::after { content:"STURGEON"; position:absolute; z-index:-1; right:-1.1rem; bottom:-2.8rem; color:transparent; -webkit-text-stroke:1px rgba(241,241,231,.25); font:900 clamp(62px,13vw,160px)/.8 Arial,sans-serif; letter-spacing:-.11em; transform:rotate(-8deg); }.hero-photo { position:absolute; z-index:-1; inset:0; width:100%; height:100%; object-fit:cover; opacity:.3; mix-blend-mode:screen; }
    .eyebrow, .section-kicker { font:700 12px/1.2 Arial,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--tan); }.hero h1 { max-width:760px; margin:13px 0 13px; font:700 clamp(43px,7vw,82px)/.94 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; letter-spacing:.01em; text-transform:uppercase; }.hero .price-line { max-width:680px; margin:0; font-size:clamp(19px,2.7vw,27px); }.hero .price-line .live-price { font-weight:700; color:#fff; }
    .access { padding:17px 20px; margin:24px 0; display:flex; gap:18px; align-items:center; justify-content:space-between; border-left:6px solid var(--rust); background:#e7e5d9; font-family:Arial,sans-serif; }.access p { margin:0; }.access .actions { display:flex; flex-wrap:wrap; gap:8px; }.access .button { border-color:var(--rust); background:var(--rust); color:#fff; text-decoration:none; }.access .button.secondary { color:var(--rust); background:transparent; }
    .section { padding:46px 0 4px; border-bottom:1px solid var(--tan); }.section h2 { margin:6px 0 18px; color:var(--olive); font:700 clamp(31px,5vw,54px)/.95 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; text-transform:uppercase; }.section h3 { margin:0; color:var(--rust); font:700 20px/1 Arial,sans-serif; text-transform:uppercase; letter-spacing:.035em; }.section p { max-width:760px; }.catalog-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px; }.product { min-height:138px; display:flex; flex-direction:column; justify-content:space-between; padding:16px; background:var(--paper); border-top:5px solid var(--brown); box-shadow:0 2px 0 rgba(36,38,34,.1); }.product.new { border-top-color:var(--rust); }.product-top { display:flex; gap:10px; align-items:flex-start; }.product-photo { display:block; flex:0 0 42px; width:42px; height:62px; object-fit:contain; }.product h4 { margin:0 0 7px; font:700 20px/1.05 Arial,sans-serif; }.meta, .availability { font:700 12px/1.35 Arial,sans-serif; letter-spacing:.035em; text-transform:uppercase; }.meta { color:var(--brown); }.availability { margin-top:12px; color:var(--olive); }.availability.out { color:var(--rust); }.price { margin-top:8px; color:var(--rust); font:700 24px/1 Arial,sans-serif; }.section-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:26px; align-items:start; }.list-section { break-inside:avoid; margin-bottom:24px; }.list-section ul { list-style:none; margin:10px 0 0; padding:0; columns:2; column-gap:16px; }.list-section li { break-inside:avoid; padding:5px 0; border-bottom:1px dotted var(--tan); }.list-section .price { font-size:16px; }.story { display:grid; grid-template-columns:1.1fr .9fr; gap:34px; padding:44px 0; }.story-copy { padding:28px; background:var(--brown); color:var(--cream); }.story-copy h2 { margin:0 0 15px; font:700 clamp(28px,4vw,46px)/.95 Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif; text-transform:uppercase; }.story-copy p { margin:0; font-size:18px; }.art { min-height:220px; position:relative; overflow:hidden; background:var(--tan); }.art::before { content:""; position:absolute; width:160%; height:46%; left:-25%; top:26%; border:8px solid var(--olive); border-radius:50%; transform:rotate(-12deg); }.art::after { content:"Oshkosh, Wisconsin"; position:absolute; bottom:18px; right:18px; color:var(--rust); font:700 13px Arial,sans-serif; text-transform:uppercase; letter-spacing:.1em; }.contact { padding:36px 0 18px; display:grid; grid-template-columns:1fr auto; gap:20px; align-items:end; }.contact img { width:190px; max-width:100%; }.contact p { margin:8px 0 0; }.contact .details { font:700 13px/1.7 Arial,sans-serif; text-transform:uppercase; letter-spacing:.05em; }.loading, .error { padding:42px; text-align:center; font:700 16px Arial,sans-serif; }.error { color:var(--rust); }
    @media (max-width:680px) { .bar { align-items:flex-start; } .bar button { white-space:nowrap; }.hero { margin:0 -18px; }.access, .story, .contact { grid-template-columns:1fr; }.access { align-items:flex-start; flex-direction:column; }.section-grid { grid-template-columns:1fr; gap:0; }.list-section ul { columns:1; }.contact img { order:-1; } }
    @page { size:letter; margin:.38in; } @media print { html, body { background:#fff; } .bar, .access .actions { display:none !important; } .page { width:auto; padding:0; }.hero { min-height:2.35in; padding:.35in .42in; margin:0; -webkit-print-color-adjust:exact; print-color-adjust:exact; }.hero h1 { font-size:43pt; }.section { padding:18pt 0 2pt; }.section h2 { font-size:29pt; }.catalog-grid { grid-template-columns:repeat(4,1fr); gap:7pt; }.product { min-height:87pt; padding:9pt; }.product h4 { font-size:12pt; }.price { font-size:16pt; }.story { gap:15pt; padding:20pt 0; }.story-copy { padding:16pt; }.story-copy h2 { font-size:25pt; }.story-copy p { font-size:12pt; }.art { min-height:150pt; }.section-grid { gap:14pt; }.list-section { margin-bottom:12pt; }.list-section li { font-size:10pt; padding:2pt 0; }.contact { padding-top:18pt; }.contact img { width:130pt; }.no-price .price { display:none; }.page-break { break-before:page; } }
  </style>
</head>
<body>
  <div class="bar"><span>Sturgeon Spirits · Wholesale</span><button id="printButton" type="button">Print / Save as PDF</button></div>
  <main class="page" id="sellSheet"><div class="loading">Loading the Sturgeon Spirits sell sheet…</div></main>
  <script>
  (() => {
    const APP_VERSION = "2026.10.05.21-WEB";
    const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;" })[char]);
    const money = cents => new Intl.NumberFormat("en-US", { style:"currency", currency:"USD", maximumFractionDigits:0 }).format(Number(cents || 0) / 100);
    const details = product => [product.size, product.abv ? `${Number(product.abv).toFixed(Number(product.abv) % 1 ? 1 : 0)}% ABV` : ""].filter(Boolean).join(" · ");
    function productCard(product, prices, section) {
      return `<article class="product ${section === "New" ? "new" : ""}"><div class="product-top"><img class="product-photo" src="assets/sell-sheet/${encodeURIComponent(product.sku_id)}.jpg" alt="" onerror="this.remove()"><div><h4>${escapeHtml(product.name)}</h4><div class="meta">${escapeHtml(details(product) || "Craft spirit")}</div></div></div><div>${prices && product.price_cents > 0 ? `<div class="price">${money(product.price_cents)}${section === "Canned cocktails" ? " / case" : ""}</div>` : ""}<div class="availability ${product.out_of_stock ? "out" : ""}">${escapeHtml(product.availability)}</div></div></article>`;
    }
    function listSection(section, prices) {
      const caption = section.section === "Canned cocktails" ? "Canned cocktails" : section.section;
      return `<section class="list-section"><h3>${escapeHtml(caption)}</h3><ul>${section.products.map(product => `<li><strong>${escapeHtml(product.name)}</strong>${details(product) ? `<br><small>${escapeHtml(details(product))}</small>` : ""}${prices && product.price_cents > 0 ? `<br><span class="price">${money(product.price_cents)}${section.section === "Canned cocktails" ? " / case" : ""}</span>` : ""}${product.out_of_stock ? `<br><small class="availability out">Currently out</small>` : ""}</li>`).join("")}</ul></section>`;
    }
    function render(data) {
      const root = document.getElementById("sellSheet"); const prices = data.access?.prices === true; const copy = data.copy || {}; const sections = data.sections || [];
      const newProducts = sections.find(section => section.section === "New")?.products || [];
      const best = sections.find(section => section.section === "Best seller")?.products || [];
      const flavorSections = sections.filter(section => !["New", "Best seller", "Canned cocktails"].includes(section.section));
      const cans = sections.find(section => section.section === "Canned cocktails");
      const priceSentence = prices ? "<span class=\"live-price\">· Live wholesale pricing shown</span>" : "";
      const access = prices ? "" : `<aside class="access"><p><strong>Wholesale pricing is for licensed retailers, bars and restaurants.</strong><br>Open an account or get in touch and we’ll help you find the right lineup.</p><div class="actions"><a class="button" href="/customer-signup.html">Open a wholesale account</a><a class="button secondary" href="mailto:sales@sturgeonspirits.com">Email us</a></div></aside>`;
      root.className = prices ? "" : "no-price";
      root.innerHTML = `<header class="hero"><img class="hero-photo" src="assets/sell-sheet/hero.jpg" alt="" onerror="this.remove()"><div class="eyebrow">Sturgeon Spirits Craft Distillery · Oshkosh, Wisconsin</div><h1>${escapeHtml(copy.headline || "Made in Oshkosh. Poured in Your Bar.")}</h1><p class="price-line">${escapeHtml(copy.price_line || "Where patience pays")} ${priceSentence}</p></header>${access}${newProducts.length ? `<section class="section"><div class="section-kicker">New from Sturgeon</div><div class="catalog-grid">${newProducts.map(product => productCard(product, prices, "New")).join("")}</div></section>` : ""}${best.length ? `<section class="section"><div class="section-kicker">Pour what locals ask for</div><h2>Our best sellers</h2><div class="catalog-grid">${best.map(product => productCard(product, prices, "Best seller")).join("")}</div></section>` : ""}<section class="story"><div class="story-copy"><h2>${escapeHtml(copy.story_heading || "Rooted in Tradition, Driven by Curiosity")}</h2><p>${escapeHtml(copy.story || "")}</p></div><div class="art" aria-label="Sturgeon Spirits made in Oshkosh"></div></section><section class="section page-break"><div class="section-kicker">More ways to make it yours</div><h2>${escapeHtml(copy.unique_heading || "As Unique As We Are")}</h2><p>${escapeHtml(copy.flavors_line || "")}<br>${escapeHtml(copy.infusion_line || "")}</p><div class="section-grid">${flavorSections.map(section => listSection(section, prices)).join("")}</div>${cans ? `<div class="section"><div class="section-kicker">Ready to pour</div>${listSection(cans, prices)}<p>${escapeHtml(copy.cans_line || "")}</p></div>` : ""}</section><footer class="contact"><div><div class="details">${escapeHtml(copy.contact || "")}</div><p>${escapeHtml(copy.footer || "Distilled and bottled in Oshkosh, Wisconsin")}<br>distribution.sturgeonspirits.com</p></div><img src="assets/sturgeon-spirits-logo.png" alt="Sturgeon Spirits Craft Distillery"></footer>`;
    }
    async function load() {
      if (location.protocol === "file:") {
        render({
          access:{ prices:false, source:"local_preview" },
          copy:{ headline:"Made in Oshkosh. Poured in Your Bar.", price_line:"Where patience pays", story_heading:"Rooted in Tradition, Driven by Curiosity", story:"For three years, we've been getting up early, working hard, and trusting the process right here in Oshkosh. We respect the old ways, but we never stop experimenting with new flavor profiles. Put our local craft spirits into your arsenal.", unique_heading:"As Unique As We Are", flavors_line:"Choose from over 40 additional flavors and spirits available.", infusion_line:"Imagine a custom infusion only available at your establishment.", contact:"Local preview — start Netlify Dev to load the live sell sheet", footer:"Distilled and bottled in Oshkosh, Wisconsin" },
          sections:[],
        });
        return;
      }
      const params = new URLSearchParams(location.search); const query = params.get("access") ? `?access=${encodeURIComponent(params.get("access"))}` : "";
      try { const response = await fetch(`/api/sell-sheet${query}`, { credentials:"same-origin", cache:"no-store" }); const data = await response.json(); if (!data.ok) throw new Error(data.error || "The sell sheet could not load."); render(data); }
      catch (error) { document.getElementById("sellSheet").innerHTML = `<div class="error">${escapeHtml(error.message || "The sell sheet could not load. Please try again.")}</div>`; }
    }
    document.getElementById("printButton").addEventListener("click", () => window.print()); load();
  })();
  </script>
</body>
</html>
