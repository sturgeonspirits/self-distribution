<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">Sturgeon Distribution Hub</title>
  <desc id="description">A side-profile sturgeon carrying a three-point distribution route.</desc>
  <!-- Sturgeon Spirits palette: slate teal, antique cream, warm tan, and rust. -->
  <rect width="512" height="512" rx="112" fill="#536f77"/>
  <!-- Tail and fin preserve the long, low side silhouette of the brand sturgeon. -->
  <path d="M126 220 54 150l20 94-40 100 92-48Z" fill="#c8bca4"/>
  <path d="M112 244c34-57 95-86 180-82 66-23 128-10 174 35l22 22-22 18c-48 48-112 66-177 46-85 6-145-17-177-39Z" fill="#f1f1e7"/>
  <!-- Long sturgeon snout and underside. -->
  <path d="M407 197c28 2 51 13 76 31l-63 20-41-7Z" fill="#c8bca4"/>
  <path d="M278 287c26 38 73 58 119 46-18 32-58 49-100 38l-43-66Z" fill="#c8bca4"/>
  <!-- Scutes make the fish read as a sturgeon without becoming a face or tentacles. -->
  <path d="m158 211 15-29 16 31m35-37 14-28 17 28m42-30 14-25 17 25m44-13 13-22 17 27" fill="none" stroke="#96321f" stroke-linecap="round" stroke-linejoin="round" stroke-width="13"/>
  <circle cx="404" cy="216" r="11" fill="#242622"/>
  <!-- Three accounts on one route: intentionally bold for browser-icon scale. -->
  <path d="M169 258h151" fill="none" stroke="#96321f" stroke-linecap="round" stroke-width="20"/>
  <circle cx="169" cy="258" r="24" fill="#96321f" stroke="#f1f1e7" stroke-width="9"/>
  <circle cx="244" cy="258" r="24" fill="#96321f" stroke="#f1f1e7" stroke-width="9"/>
  <circle cx="320" cy="258" r="24" fill="#96321f" stroke="#f1f1e7" stroke-width="9"/>
  <circle cx="169" cy="258" r="6" fill="#f1f1e7"/>
  <circle cx="244" cy="258" r="6" fill="#f1f1e7"/>
  <circle cx="320" cy="258" r="6" fill="#f1f1e7"/>
</svg>
